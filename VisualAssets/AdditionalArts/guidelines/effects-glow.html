<!-- @dsCard group="Effects" viewport="700x150" name="Glow & panels" subtitle="Accent glows, panel shadow + inset, scanline texture" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);display:flex;gap:20px;align-items:center}.g{width:90px;height:64px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase}</style></head><body>
<div class="g" style="border:1px solid var(--teal);box-shadow:var(--glow-teal)">glow-teal</div>
<div class="g" style="border:1px solid var(--quantum-purple);box-shadow:var(--glow-purple)">glow-purple</div>
<div class="g" style="border:1px solid var(--atom-gold);box-shadow:var(--glow-gold)">glow-gold</div>
<div class="g" style="border:1px solid var(--alert-red);box-shadow:var(--glow-red)">glow-red</div>
<div class="g" style="border:1px solid var(--border-panel);box-shadow:var(--shadow-panel);width:130px">shadow-panel</div>
<div class="g" style="border:1px solid var(--border-panel);box-shadow:var(--inset-panel);background:var(--surface-panel);width:130px;background-image:var(--scanline)">inset + scanline</div>
</body></html>
