<!-- @dsCard group="Colors" viewport="700x130" name="Stat bars" subtitle="HP / EP / XP gradients on dark track" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);display:flex;flex-direction:column;gap:14px}.r{display:flex;align-items:center;gap:12px}.l{width:90px;font-family:var(--font-display);font-size:10px;letter-spacing:.12em}.t{flex:1;height:12px;background:var(--bar-track);border:1px solid var(--border-panel)}.f{height:100%}</style></head><body>
<div class="r"><div class="l" style="color:var(--bar-hp)">HP 520/520</div><div class="t"><div class="f" style="width:82%;background:linear-gradient(90deg,var(--bar-hp),var(--bar-hp-hi))"></div></div></div>
<div class="r"><div class="l" style="color:var(--bar-ep-hi)">EP 80/80</div><div class="t"><div class="f" style="width:55%;background:linear-gradient(90deg,var(--bar-ep),var(--bar-ep-hi))"></div></div></div>
<div class="r"><div class="l" style="color:var(--bar-xp-hi)">XP 12,450</div><div class="t"><div class="f" style="width:38%;background:linear-gradient(90deg,var(--bar-xp),var(--bar-xp-hi))"></div></div></div>
</body></html>
