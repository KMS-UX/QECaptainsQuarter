<!-- @dsCard group="Icons" viewport="700x210" name="Items & world" subtitle="Real pixel sprites — data-driven from assets/data/items.json" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--surface-page);display:flex;flex-direction:column;gap:12px}.grp{display:flex;flex-direction:column;gap:6px}.h{font-family:var(--font-display);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-section)}.row{display:flex;gap:8px;flex-wrap:wrap}.s{width:44px;height:44px;background:var(--surface-inset);border:1px solid var(--border-panel);border-radius:var(--radius-1);display:flex;align-items:center;justify-content:center}.s img{width:100%;height:100%;image-rendering:pixelated}</style></head><body>
<div id="g"></div>
<script src="../assets/data/content.js"></script>
<script>
const GROUPS=[['Weapons',['weapon']],['Consumables & materials',['consumable','material']],['Currency & chests',['currency','container']]];
QEContent.load('../assets/data').then(({items})=>{
  g.innerHTML=GROUPS.map(([label,types])=>{
    const row=items.filter(i=>types.includes(i.type)).map(i=>`<div class="s" title="${i.name} · ${i.rarity}"><img src="../assets/${i.icon}" alt="${i.name}"></div>`).join('');
    return `<div class="grp"><div class="h">${label}</div><div class="row">${row}</div></div>`;
  }).join('');
});
</script>
</body></html>
