<!-- @dsCard group="World & Dungeon" viewport="860x440" name="Map UI & iconography" subtitle="Minimap widget, region info panel, node/location types & full world-map icon set" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-primary);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:12px}
figure{margin:0;position:relative;border:1px solid var(--border-panel);border-radius:var(--radius-1);overflow:hidden;background:var(--surface-inset)}
figure img{width:100%;display:block;object-fit:cover}
figcaption{position:absolute;top:0;left:0;padding:3px 8px;background:rgba(3,6,12,.72);border-right:1px solid var(--border-panel);border-bottom:1px solid var(--border-panel);font-family:var(--font-display);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.tall{grid-row:span 2}
</style></head><body>
<figure class="tall"><img src="../assets/worldmap/ui/region-info-panel.png" alt="Region info panel" style="height:100%;object-fit:contain"><figcaption>Region info panel</figcaption></figure>
<figure><img src="../assets/worldmap/ui/minimap-ui.png" alt="Minimap UI"><figcaption>Minimap widget</figcaption></figure>
<figure><img src="../assets/worldmap/ui/node-types.png" alt="Node & location types"><figcaption>Node / location types</figcaption></figure>
<figure style="grid-column:1 / -1"><img src="../assets/worldmap/ui/map-icons.png" alt="Map icon set"><figcaption>World-map icon set</figcaption></figure>
<figure style="grid-column:1 / -1"><img src="../assets/worldmap/ui/poi-examples.png" alt="Points of interest"><figcaption>Points of interest</figcaption></figure>
</body></html>
