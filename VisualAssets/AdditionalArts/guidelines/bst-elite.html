<!-- @dsCard group="Bestiary" viewport="860x560" name="Elite & high-threat enemies" subtitle="Featured elites + apocalyptic aberrations & boss-class threats for combat art and threat UI" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-primary);display:flex;flex-direction:column;gap:16px}
h4{margin:0 0 -4px;font-family:var(--font-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary,#8aa)}
figure{margin:0;position:relative;border:1px solid var(--border-panel);border-radius:var(--radius-1);overflow:hidden;background:var(--surface-inset)}
figure img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;background:linear-gradient(transparent,rgba(3,6,12,.94));font-family:var(--font-display);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat figure{aspect-ratio:250/305}
.row{display:grid;gap:8px}
.r5{grid-template-columns:repeat(5,1fr)}.r5 figure{aspect-ratio:150/150}
.r4{grid-template-columns:repeat(4,1fr)}.r4 figure{aspect-ratio:112/170}
</style></head><body>
<h4>Featured elites</h4>
<div class="feat" id="f"></div>
<h4>High-threat aberrations</h4>
<div class="row r5" id="h"></div>
<h4>Boss-class threats</h4>
<div class="row r4" id="c"></div>
<script src="../assets/data/content.js"></script>
<script>
function fill(el,s){el.innerHTML=s.entries.map(e=>`<figure><img src="../assets/${s.base}${e.id}.png" alt="${e.label}"><figcaption>${e.label}</figcaption></figure>`).join('')}
QEContent.loadCatalog('../assets/data').then(g=>{fill(f,g['bestiary-featured']);fill(h,g['bestiary-highthreat']);fill(c,g['bestiary-bossclass']);});
</script>
</body></html>
