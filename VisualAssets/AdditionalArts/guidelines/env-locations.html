<!-- @dsCard group="Environments" viewport="820x400" name="Scenario locations" subtitle="12 major world locations — backdrops for quests, loading screens, region cards" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-primary)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.loc{position:relative;border:1px solid var(--border-panel);border-radius:var(--radius-1);overflow:hidden;aspect-ratio:192/128;background:var(--surface-inset)}
.loc img{width:100%;height:100%;object-fit:cover;display:block}
.loc figcaption{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;background:linear-gradient(transparent,rgba(3,6,12,.92));font-family:var(--font-display);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-primary)}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const B='../assets/environments/locations/';
const L=[['neo-solis','Neo Solis'],['corporate-ark','Corporate Ark'],['quantum-lab','Quantum Lab'],['undercity','The Undercity'],['wasteland-frontier','Wasteland Frontier'],['abandoned-military-base','Military Base'],['vagabond-outpost','Vagabond Outpost'],['ancient-ruins','Ancient Ruins'],['deserted-highway','Deserted Highway'],['deep-sea-facility','Deep Sea Facility'],['ice-wastes','Ice Wastes'],['alien-crash-site','Alien Crash Site']];
document.getElementById('g').innerHTML=L.map(([f,n])=>`<figure class="loc"><img src="${B}${f}.png" alt="${n}"><figcaption>${n}</figcaption></figure>`).join('');
</script>
</body></html>
