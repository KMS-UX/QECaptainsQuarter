<!-- @dsCard group="Colors" viewport="700x140" name="Rarity scale" subtitle="7 tiers — frame + name color on items" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--surface-page);display:flex;gap:8px}.s{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}.f{width:56px;height:56px;background:var(--surface-inset);display:flex;align-items:center;justify-content:center;font-size:20px}.l{font-family:var(--font-display);font-size:9px;letter-spacing:.1em;text-transform:uppercase}</style></head><body>
<div class="s"><div class="f" style="border:2px solid var(--rarity-common);color:var(--rarity-common)">◆</div><div class="l" style="color:var(--rarity-common)">Common</div></div>
<div class="s"><div class="f" style="border:2px solid var(--rarity-uncommon);color:var(--rarity-uncommon)">◆</div><div class="l" style="color:var(--rarity-uncommon)">Uncommon</div></div>
<div class="s"><div class="f" style="border:2px solid var(--rarity-rare);color:var(--rarity-rare)">◆</div><div class="l" style="color:var(--rarity-rare)">Rare</div></div>
<div class="s"><div class="f" style="border:2px solid var(--rarity-epic);color:var(--rarity-epic);box-shadow:var(--glow-purple)">◆</div><div class="l" style="color:var(--rarity-epic)">Epic</div></div>
<div class="s"><div class="f" style="border:2px solid var(--rarity-legendary);color:var(--rarity-legendary);box-shadow:var(--glow-gold)">◆</div><div class="l" style="color:var(--rarity-legendary)">Legendary</div></div>
<div class="s"><div class="f" style="border:2px solid var(--rarity-mythic);color:var(--rarity-mythic);box-shadow:var(--glow-red)">◆</div><div class="l" style="color:var(--rarity-mythic)">Mythic</div></div>
<div class="s"><div class="f" style="border:2px solid var(--rarity-exotic);color:var(--rarity-exotic);box-shadow:var(--glow-teal)">◆</div><div class="l" style="color:var(--rarity-exotic)">Exotic</div></div>
</body></html>
