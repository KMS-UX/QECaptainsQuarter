<!-- @dsCard group="Colors" viewport="700x130" name="Quest tiers" subtitle="Quest type color coding" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--surface-page);display:flex;gap:8px}.s{flex:1;border:1px solid var(--border-panel);background:var(--surface-panel)}.h{height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:9px;letter-spacing:.12em;color:var(--void-0)}.b{padding:8px;font-size:10px;color:var(--text-faint)}</style></head><body>
<div class="s"><div class="h" style="background:var(--quest-main)">MAIN STORY</div><div class="b">--quest-main</div></div>
<div class="s"><div class="h" style="background:var(--quest-side)">SIDE QUEST</div><div class="b">--quest-side</div></div>
<div class="s"><div class="h" style="background:var(--quest-faction)">FACTION</div><div class="b">--quest-faction</div></div>
<div class="s"><div class="h" style="background:var(--quest-world)">WORLD EVENT</div><div class="b">--quest-world</div></div>
<div class="s"><div class="h" style="background:var(--quest-daily)">DAILY</div><div class="b">--quest-daily</div></div>
<div class="s"><div class="h" style="background:var(--quest-hidden)">HIDDEN</div><div class="b">--quest-hidden</div></div>
</body></html>
