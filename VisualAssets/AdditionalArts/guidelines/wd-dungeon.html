<!-- @dsCard group="World & Dungeon" viewport="860x440" name="Dungeon biomes & modular kit" subtitle="5 themed dungeon biomes + modular pieces, room templates & trap/hazard set (64×64 grid, 2-tile walls)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-primary);display:flex;flex-direction:column;gap:16px}
h4{margin:0 0 -4px;font-family:var(--font-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary,#8aa)}
.biomes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.b{position:relative;border:1px solid var(--border-panel);border-radius:var(--radius-1);overflow:hidden;aspect-ratio:146/152;background:var(--surface-inset)}
.b img{width:100%;height:100%;object-fit:cover;display:block}
.b figcaption{position:absolute;left:0;right:0;bottom:0;padding:4px 5px;background:linear-gradient(transparent,rgba(3,6,12,.94));font-family:var(--font-display);font-size:8px;letter-spacing:.05em;text-transform:uppercase;text-align:center}
.ref{display:grid;grid-template-columns:2fr 1fr 1.6fr;gap:8px}
.r{position:relative;border:1px solid var(--border-panel);border-radius:var(--radius-1);overflow:hidden;background:var(--surface-inset)}
.r img{width:100%;display:block}
.r figcaption{position:absolute;top:0;left:0;padding:3px 7px;background:rgba(3,6,12,.72);border-right:1px solid var(--border-panel);border-bottom:1px solid var(--border-panel);font-family:var(--font-display);font-size:8px;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<h4>Dungeon biomes</h4>
<div class="biomes" id="b"></div>
<h4>Generation building blocks</h4>
<div class="ref">
<figure class="r" style="margin:0"><img src="../assets/dungeon/ref/modular-pieces.png" alt="Modular pieces"><figcaption>Modular pieces</figcaption></figure>
<figure class="r" style="margin:0"><img src="../assets/dungeon/ref/room-templates.png" alt="Room templates"><figcaption>Room templates</figcaption></figure>
<figure class="r" style="margin:0"><img src="../assets/dungeon/ref/traps.png" alt="Traps & hazards"><figcaption>Traps & hazards</figcaption></figure>
</div>
<script>
const B='../assets/dungeon/biomes/';
b.innerHTML=[['ancient-ruins','Ancient Ruins'],['crystal-caverns','Crystal Caverns'],['mechanical-core','Mechanical Core'],['volcanic-depths','Volcanic Depths'],['void-corridor','Void Corridor']].map(([f,n])=>`<figure class="b"><img src="${B}${f}.png" alt="${n}"><figcaption>${n}</figcaption></figure>`).join('');
</script>
</body></html>
