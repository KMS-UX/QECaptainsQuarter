<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--surface-page);display:flex;gap:8px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.c{height:64px;border:1px solid var(--border-panel)}.l{font-size:10px;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase}.v{font-size:10px;color:var(--text-faint)}</style></head><body>
<div class="s"><div class="c" style="background:var(--teal)"></div><div class="l" style="color:var(--teal)">Teal · tech/UI</div><div class="v">--teal</div></div>
<div class="s"><div class="c" style="background:var(--quantum-purple)"></div><div class="l" style="color:var(--quantum-purple)">Purple · quantum</div><div class="v">--quantum-purple</div></div>
<div class="s"><div class="c" style="background:var(--electric-blue)"></div><div class="l" style="color:var(--electric-blue)">Blue · energy</div><div class="v">--electric-blue</div></div>
<div class="s"><div class="c" style="background:var(--atom-gold)"></div><div class="l" style="color:var(--atom-gold)">Gold · premium</div><div class="v">--atom-gold</div></div>
<div class="s"><div class="c" style="background:var(--ember-orange)"></div><div class="l" style="color:var(--ember-orange)">Orange · heat</div><div class="v">--ember-orange</div></div>
<div class="s"><div class="c" style="background:var(--alert-red)"></div><div class="l" style="color:var(--alert-red)">Red · alert</div><div class="v">--alert-red</div></div>
<div class="s"><div class="c" style="background:var(--success-green)"></div><div class="l" style="color:var(--success-green)">Green · life</div><div class="v">--success-green</div></div>
</body></html>
