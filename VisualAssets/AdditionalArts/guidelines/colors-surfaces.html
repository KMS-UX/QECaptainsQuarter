<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--surface-page);display:flex;gap:8px}.s{flex:1;display:flex;flex-direction:column;gap:6px}.c{height:56px;border:1px solid var(--border-panel);display:flex;align-items:center;justify-content:center;font-size:11px}.v{font-size:10px;color:var(--text-faint)}</style></head><body>
<div class="s"><div class="c" style="background:var(--void-0)"></div><div class="v">--void-0 page</div></div>
<div class="s"><div class="c" style="background:var(--void-1)"></div><div class="v">--void-1 panel</div></div>
<div class="s"><div class="c" style="background:var(--void-2)"></div><div class="v">--void-2 raised</div></div>
<div class="s"><div class="c" style="background:var(--void-3)"></div><div class="v">--void-3</div></div>
<div class="s"><div class="c" style="background:var(--void-4)"></div><div class="v">--void-4</div></div>
<div class="s"><div class="c" style="background:var(--void-1);color:var(--fg-1)">--fg-1 body</div><div class="v">--text-body</div></div>
<div class="s"><div class="c" style="background:var(--void-1);color:var(--fg-2)">--fg-2 muted</div><div class="v">--text-muted</div></div>
<div class="s"><div class="c" style="background:var(--void-1);color:var(--fg-3)">--fg-3 faint</div><div class="v">--text-faint</div></div>
</body></html>
