<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);display:flex;gap:24px;align-items:flex-end}.g{display:flex;flex-direction:column;align-items:center;gap:6px}.b{background:var(--teal);width:24px}.l{font-size:9px;color:var(--text-faint)}.rr{background:var(--surface-raised);border:1px solid var(--border-bright);width:56px;height:56px}</style></head><body>
<div class="g"><div class="b" style="height:4px"></div><div class="l">sp-1 4</div></div>
<div class="g"><div class="b" style="height:8px"></div><div class="l">sp-2 8</div></div>
<div class="g"><div class="b" style="height:12px"></div><div class="l">sp-3 12</div></div>
<div class="g"><div class="b" style="height:16px"></div><div class="l">sp-4 16</div></div>
<div class="g"><div class="b" style="height:24px"></div><div class="l">sp-5 24</div></div>
<div class="g"><div class="b" style="height:32px"></div><div class="l">sp-6 32</div></div>
<div class="g"><div class="b" style="height:48px"></div><div class="l">sp-7 48</div></div>
<div class="g" style="margin-left:24px"><div class="rr" style="border-radius:0"></div><div class="l">radius-0</div></div>
<div class="g"><div class="rr" style="border-radius:2px"></div><div class="l">radius-1 2</div></div>
<div class="g"><div class="rr" style="border-radius:4px"></div><div class="l">radius-2 4</div></div>
<div class="g"><div class="rr" style="border-radius:6px"></div><div class="l">radius-3 6</div></div>
<div class="g" style="margin-left:24px"><div class="rr" style="width:44px;height:44px;border-color:var(--atom-gold)"></div><div class="l" style="color:var(--atom-gold)">44px hit min</div></div>
</body></html>
