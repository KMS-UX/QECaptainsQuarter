<!-- @dsCard group="Characters" viewport="860x620" name="Portrait library" subtitle="40 pixel portraits — heroes, NPCs, factions, companions & villains for dialogue, party & codex UI" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-primary);display:flex;flex-direction:column;gap:14px}
h4{margin:0 0 -2px;font-family:var(--font-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary,#8aa)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.p{position:relative;border:1px solid var(--border-panel);border-radius:var(--radius-1);overflow:hidden;aspect-ratio:88/104;background:var(--surface-inset)}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.p figcaption{position:absolute;left:0;right:0;bottom:0;padding:3px 4px;background:linear-gradient(transparent,rgba(3,6,12,.94));font-family:var(--font-display);font-size:7px;letter-spacing:.03em;text-transform:uppercase;text-align:center}
</style></head><body>
<div id="root"></div>
<script src="../assets/data/content.js"></script>
<script>
const B='../assets/characters/portraits/';
QEContent.load('../assets/data').then(({portraitGroups})=>{
  root.innerHTML=portraitGroups.map(g=>`<h4>${g.label}</h4><div class="grid">${g.portraits.map(p=>`<figure class="p"><img src="${B}${g.dir}/${p.id}.png" alt="${p.name}"><figcaption>${p.name}</figcaption></figure>`).join('')}</div>`).join('');
});
</script>
</body></html>
