<!-- @dsCard group="Icon Library" viewport="760x470" name="Faction emblems & mapping" subtitle="9 lore factions paired to emblem sprites + color tokens" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:16px;background:var(--surface-page);color:var(--text-primary)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--surface-panel);border:1px solid var(--border-panel);border-radius:var(--radius-1);padding:11px;display:flex;gap:10px;align-items:center}
.em{width:46px;height:46px;flex:0 0 auto;background:var(--surface-inset);border:1px solid var(--border-panel);border-radius:var(--radius-1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.em img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.n{font-family:var(--font-display);font-size:11px;letter-spacing:.06em}
.b{font-family:var(--font-ui);font-size:8.5px;color:var(--text-faint);letter-spacing:.02em;line-height:1.3}
.swatch{width:26px;height:6px;border-radius:3px}
.legend{margin-top:14px;font-family:var(--font-ui);font-size:9px;color:var(--text-faint);letter-spacing:.03em;line-height:1.5}
.tag{font-family:var(--font-ui);font-size:7.5px;color:var(--rarity-uncommon);letter-spacing:.1em;text-transform:uppercase}
</style></head><body>
<div class="grid" id="g"></div>
<div class="legend"><span class="tag">emergent</span> Eclipse Syndicate, Horizon Coalition, The Curators, The Exile Front &amp; The Synthic Faith added to scope. Synthic's emblem is a lime-recolored augmentation mark (no dedicated sprite on the source sheet). Emblem PNGs live in <b>assets/icon-library/factions/</b>; full mapping in <b>manifest.json</b>.</div>
<script>
const B='../assets/icon-library/factions/';
const F=[
 ['AURELIAN ORDER','faction-arclight','--faction-aurelian','original · gold radiant star'],
 ['EMBERPACT','faction-outlaws','--faction-emberpact','original · fierce orange star'],
 ['VOID SEEKERS','faction-voidsentinels','--faction-voidseekers','original · purple void sigil'],
 ['IRONWARD','faction-mechanicum','--faction-ironward','original · industrial gear'],
 ['ECLIPSE SYNDICATE','faction-mysticscoven','--faction-eclipse','emergent · magenta occult star'],
 ['HORIZON COALITION','faction-explorersleague','--faction-horizon','emergent · teal compass'],
 ['THE CURATORS','faction-tradersguild','--faction-curators','emergent · gold scholarly seal'],
 ['THE EXILE FRONT','faction-ironaccord','--faction-exile','emergent · steel militant mark'],
 ['THE SYNTHIC FAITH','faction-synthicfaith','--faction-synthic','emergent · lime augment emblem'],
];
document.getElementById('g').innerHTML=F.map(([n,img,tok,b])=>`
<div class="card"><div class="em"><img src="${B}${img}.png"></div>
<div class="meta"><div class="n" style="color:var(${tok})">${n}</div>
<div class="swatch" style="background:var(${tok})"></div>
<div class="b">${b}</div></div></div>`).join('');
</script>
</body></html>
