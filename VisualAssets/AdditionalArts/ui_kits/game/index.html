<!DOCTYPE html><html><head><meta charset="utf-8"><title>Quantum Effect — Game UI</title><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;height:100%;background:#000}#app{position:relative;width:1280px;height:800px;margin:0 auto;overflow:hidden;border:1px solid var(--border-panel)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="kit.jsx"></script>
<script type="text/babel" src="MainMenu.jsx"></script>
<script type="text/babel" src="ExplorationHUD.jsx"></script>
<script type="text/babel" src="QuestLog.jsx"></script>
<script type="text/babel" src="Inventory.jsx"></script>
<script type="text/babel" src="DialogueScene.jsx"></script>
</head><body><div id="app"></div>
<script type="text/babel" data-presets="react">
function App(){
  const [screen,setScreen]=React.useState('menu');
  const go=s=>()=>setScreen(s);
  switch(screen){
    case 'menu': return <window.MainMenu onPlay={go('hud')}/>;
    case 'hud': return <window.ExplorationHUD onOpenQuests={go('quests')} onOpenInventory={go('inventory')} onTalk={go('dialogue')}/>;
    case 'quests': return <window.QuestLog onBack={go('hud')}/>;
    case 'inventory': return <window.Inventory onBack={go('hud')}/>;
    case 'dialogue': return <window.DialogueScene onBack={go('hud')}/>;
    default: return null;
  }
}
function mount(){ if(window.MainMenu&&window.DS&&window.DialogueScene) ReactDOM.createRoot(document.getElementById('app')).render(<App/>); else setTimeout(mount,50); }
mount();
</script></body></html>
